name: CI

# Every check in this file is one that has already caught a real defect in this
# project. The encoding scan is here because a bulk edit once introduced BOMs
# and mojibake into seven files; the locale verification because a missing key
# in one of five catalogues is a compile error nobody sees locally until they
# build; the E2E suite because typecheck and lint have both passed on code that
# could not render.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in progress for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same values in both jobs. None is a secret: the database is a throwaway
  # service container, and AUTH_SECRET only has to satisfy the 32-character
  # minimum in src/lib/env.ts.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/glex_ci
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
  APP_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_NAME: GLEX
  CONTACT_TO_EMAIL: ci@example.com
  EMAIL_PROVIDER: console
  STORAGE_PROVIDER: local
  TRACKING_PROVIDER: internal

jobs:
  static:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest

    # `npm test` is not purely unit tests: src/lib/__tests__/rate-limit.test.ts
    # exercises the real limiter against PostgreSQL, because a fixed-window
    # limiter is only meaningful against the table it counts in.
    #
    # Without a database it did not error usefully — `checkRateLimit` fails OPEN
    # by design, so every "should be blocked" assertion got `allowed: true` and
    # the suite reported wrong answers rather than a missing dependency.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glex_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d glex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `postinstall` runs `prisma generate`, so the client exists from here on.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        # The rate-limit suite needs the RateLimit table to exist.
        run: npm run db:deploy

      - name: Unit tests
        run: npm test

      - name: All five locales carry the same keys
        run: node scripts/verify-locales.mjs

      - name: No BOMs or mojibake
        run: node scripts/check-encoding.mjs

      - name: Production build
        # Without this a pull request could break the build and only find out
        # after merging, since the production E2E job does not run on PRs.
        # `next build` sets NODE_ENV=production itself, and src/lib/env.ts
        # refuses console mail under it — hence the override. No database is
        # needed: sitemap.ts is prerendered and queries one, but both queries
        # degrade to an empty list by design.
        run: npm run build
        env:
          EMAIL_PROVIDER: smtp
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: '1025'

      - name: Production dependency audit
        # Fails on CRITICAL only. Four HIGH advisories in the nodemailer →
        # @auth/core → next-auth chain have no published fix, and this codebase
        # does not use the affected `raw` option; failing on high would make the
        # gate permanently red and therefore ignored. Revisit when upstream
        # ships — see STATUS.md.
        run: npm audit --omit=dev --audit-level=critical

  e2e:
    name: End-to-end (dev server)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glex_ci
        ports: ['5432:5432']
        # Without this the first migration can race the database's own startup.
        options: >-
          --health-cmd "pg_isready -U postgres -d glex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      # The suite signs in as the demo accounts, so they have to exist. This is
      # a throwaway database; src/lib/env.ts still refuses this flag under
      # NODE_ENV=production.
      SEED_DEMO_DATA: 'true'
      SEED_DEMO_PASSWORD: ci-only-throwaway-not-a-shared-default-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        # Only the browsers the config actually declares projects for.
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed
        run: npm run db:seed

      - name: Run the suite
        run: npm run test:e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  e2e-production:
    name: End-to-end (production build)
    # The dev server is a developer convenience; this is what actually ships.
    # It went unrun for the whole project because the Playwright config asserted
    # it was impossible, so it is a job rather than a note in a README.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glex_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d glex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      # This job starts the production server itself, below. Without this
      # Playwright refuses the port it is standing on and tries to launch
      # `npm run dev` — the dev server this job exists to avoid.
      E2E_REUSE_SERVER: 'true'
      EMAIL_PROVIDER: smtp
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      # A seed-time flag, not a runtime one: seeding happens below with
      # NODE_ENV unset, and the demo accounts persist into the production run.
      SEED_DEMO_PASSWORD: ci-only-throwaway-not-a-shared-default-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Apply migrations
        run: npm run db:deploy

      - name: Seed, including the accounts the suite signs in as
        run: npm run db:seed
        env:
          SEED_DEMO_DATA: 'true'

      - name: Build
        run: npm run build

      - name: Start an SMTP sink
        # src/lib/env.ts refuses EMAIL_PROVIDER=console under NODE_ENV=production,
        # and every send would otherwise error against a dead port.
        #
        # Run from npm rather than as a service container: `maildev/maildev:latest`
        # is a 3.0 release candidate and failed to start as a service, taking the
        # whole job down before checkout. This is also the arrangement actually
        # verified locally, rather than a second one assumed to be equivalent.
        run: |
          npx --yes maildev --smtp 1025 --web 1080 --silent &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:1080 > /dev/null 2>&1; then
              echo "smtp sink up"; exit 0
            fi
            sleep 2
          done
          echo "the SMTP sink did not start within 60s"; exit 1

      - name: Start and wait for it to answer
        # Polls the liveness probe rather than pulling in a wait-for-it package.
        run: |
          npm start &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "up"; exit 0
            fi
            sleep 2
          done
          echo "server did not become healthy within 120s"; exit 1

      - name: Run the suite
        # webServer reuses the server already listening on the port.
        run: npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-production
          path: test-results/
          retention-days: 7

  artifact:
    name: Deployable artifact
    # Built on Linux on purpose. Output file tracing copies the platform's own
    # native binaries into .next/standalone — a build on a Windows workstation
    # bundles @img/sharp-win32-x64, which fails the moment image optimisation
    # runs on the Linux host it was uploaded to.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      # Baked into the bundle at build time, not read at runtime. This is the
      # value that ends up in sitemap.xml, robots.txt, canonical tags and every
      # OpenGraph URL, and it cannot be corrected after the fact by the host.
      NEXT_PUBLIC_APP_URL: https://www.exporthouse.com.sa
      APP_URL: https://www.exporthouse.com.sa
      AUTH_URL: https://www.exporthouse.com.sa
      EMAIL_PROVIDER: smtp
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        # Copies public/ and .next/static in, and strips any .env. Without this
        # the server boots and 404s every asset.
        run: npm run package:standalone

      - name: Prove the artifact boots
        # The suite runs against `next start`; this is the standalone server that
        # actually ships. Liveness only — no database is attached to this job.
        run: |
          PORT=3000 node .next/standalone/server.js &
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then
              echo "artifact booted"; exit 0
            fi
            sleep 2
          done
          echo "the packaged artifact did not answer within 60s"; exit 1

      - name: Refuse to publish an artifact containing secrets
        run: |
          if ls .next/standalone/.env* > /dev/null 2>&1; then
            echo "an .env file survived packaging"; exit 1
          fi
          echo "no .env in the artifact"

      - uses: actions/upload-artifact@v4
        with:
          name: glex-standalone
          path: .next/standalone
          retention-days: 14
